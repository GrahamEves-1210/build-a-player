# iOS → TestFlight on GitHub's free macOS machines (public repo). Same steps as
# codemagic.yaml, with Codemagic's open-source CLI tools. Start it by hand:
# Actions → "iOS → TestFlight" → Run workflow → branch: app.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ASC_ISSUER_ID            App Store Connect → Users and Access → Integrations → Issuer ID
#   ASC_KEY_ID               the API key's Key ID (also in AuthKey_<KEYID>.p8)
#   ASC_PRIVATE_KEY          the whole .p8 file, BEGIN to END lines included
#   CERTIFICATE_PRIVATE_KEY  the private key for the iOS distribution certificate
name: iOS → TestFlight
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: com.buildaplayer.app
    steps:
      - uses: actions/checkout@v5
      # the build number: above anything Codemagic uploaded, and higher every run
      # (workflow expressions can't do arithmetic, so the shell does it)
      - name: Build number
        run: echo "PROJECT_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      # Apple only takes builds from Xcode 26 (the iOS 26 SDK) or later; the
      # machine's default can be older, so pick the newest Xcode 26 it has
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this machine. Installed:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Build the web app and copy it into the native projects
        run: npm run build:app
      - name: Codemagic CLI tools
        run: pipx install codemagic-cli-tools
      - name: Apply App Store signing
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the .ipa
        run: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER"
      - name: Upload to TestFlight
        run: app-store-connect publish --path build/ios/ipa/*.ipa --testflight
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
