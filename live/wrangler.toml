# Build-A-Player live server: the Blacktop 3v3 lobby and its game rooms.
# Its own Worker, separate from the website (Cloudflare Pages): deploy with
#   cd server && npx wrangler deploy
name = "bap-live"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects (the kind the free plan includes)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]

# The Trait Auction (src/auction.js): a queue per sport + position, a room per auction
[[durable_objects.bindings]]
name = "AUCTION_QUEUE"
class_name = "AuctionQueue"

[[durable_objects.bindings]]
name = "AUCTION_ROOM"
class_name = "AuctionRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuctionQueue", "AuctionRoom"]

# Compete pools (src/compete.js): a queue per sport + position, a room per pool
[[durable_objects.bindings]]
name = "COMPETE_QUEUE"
class_name = "CompeteQueue"

[[durable_objects.bindings]]
name = "COMPETE_ROOM"
class_name = "CompeteRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CompeteQueue", "CompeteRoom"]

# The Blacktop games anyone can watch (src/games.js): one list, every live 1v1, 2v2 and 3v3
[[durable_objects.bindings]]
name = "GAMES"
class_name = "Games"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Games"]

# the shared game rules come from the app (../src): they read import.meta.env
[define]
"import.meta.env" = '{"DEV":false,"PROD":true}'

# Supabase, for checking results before they reach the boards (src/submit.js). Both are public;
