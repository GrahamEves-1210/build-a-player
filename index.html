    <!-- Boot guard. If the app's files fail to load (a browser holding a bad
         cached copy, e.g. the HTML fallback stored as a script; an old service
         worker) or the app never starts, it repairs itself, no clicks:
           1st try: re-download every app file past the browser cache, clear
                    old caches and service workers, reload
           2nd try: the same, plus clear the site's saved data (keeps the
                    login), reload
           then:    a short note at the top (something on their end, like an
                    ad blocker, is blocking the site's files)
         Each case is reported to Google Analytics as boot_fail. -->
    <script>
    (function () {
      var KEY = 'bap_boot_fix', WHY = 'bap_boot_reason', tried = 0, failed = [], firstErr = null, busy = false
      try { tried = +sessionStorage.getItem(KEY) || 0 } catch (e) {}
      function report(reason) { try { window.gtag && window.gtag('event', 'boot_fail', { reason: String(reason).slice(0, 100), retry: tried }) } catch (e) {} }
      // a repair reloads before Analytics can send: carry the reason over
      try {
        var pending = sessionStorage.getItem(WHY)
        if (pending) { sessionStorage.removeItem(WHY); setTimeout(function () { report(pending) }, 4000) }
      } catch (e) {}
      function clearAll() {
        // every app file the page uses, not only the one that reported: a bad
        // copy of a shared library chunk shows up as the main script failing
        var urls = failed.slice()
        try { [].forEach.call(document.querySelectorAll('script[src*="/assets/"],link[href*="/assets/"]'), function (el) { urls.push(el.src || el.href) }) } catch (e) {}
        var jobs = urls.filter(function (u, i) { return urls.indexOf(u) === i }).map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}) })
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }).catch(function () {}))
        if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }).catch(function () {}))
        // never hang on a slow request: reload after 8s either way
        return Promise.race([Promise.all(jobs), new Promise(function (r) { setTimeout(r, 8000) })])
      }
      function clearSaved() {
        try { for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf('sb-') !== 0) localStorage.removeItem(k) } } catch (e) {}
      }
      function rescue(reason) {
        if (busy) return
        busy = true
        if (tried >= 2) { report(reason + ' (gave up)'); note(); return }
        try { sessionStorage.setItem(KEY, String(tried + 1)); sessionStorage.setItem(WHY, String(reason).slice(0, 80) + (tried ? ' (2nd repair)' : ' (1st repair)')) } catch (e) {}
        if (tried >= 1) clearSaved()
        clearAll().then(function () { location.reload() })
      }
      // after both repairs: say so, at the top (the bottom is where the ad rail loads)
      function note() {
        if (document.getElementById('bap-boot')) return
        var d = document.createElement('div')
        d.id = 'bap-boot'
        d.setAttribute('style', 'position:fixed;left:12px;right:12px;top:12px;z-index:2147483647;max-width:460px;margin:0 auto;padding:14px 16px;border-radius:14px;background:#0f1612;border:1px solid #2b4a3a;color:#eef8f1;font:14.5px/1.45 system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.6)')
        d.innerHTML = '<b style="display:block;font-size:16px;margin-bottom:4px">Build-A-Player can’t load right now</b>Something on this device is blocking the site’s files — usually an ad blocker or another browser extension, or the network. Turn extensions off for this site or try another browser.'
        document.body.appendChild(d)
        try { sessionStorage.removeItem(KEY) } catch (e) {}   // the next visit gets the full repair again
      }
      // a file under /assets/ failed (missing, or served as the HTML page)
      window.addEventListener('error', function (e) {
        var t = e.target, u = t && (t.src || t.href)
        if (u && /\/assets\//.test(u)) { failed.push(u); rescue('asset ' + u.split('/').pop()) }
        else if (!firstErr && e.message) firstErr = e.message
      }, true)
      window.addEventListener('unhandledrejection', function (e) { if (!firstErr) firstErr = String((e.reason && e.reason.message) || e.reason) })
      // the app never drew anything
      function booted() { var r = document.getElementById('root'); return !!(r && r.children.length && !r.querySelector('.seo-prerender')) }
      setTimeout(function () {
        if (booted()) { try { sessionStorage.removeItem(KEY) } catch (e) {}; return }
        if (window.__bapStarted) rescue('no render: ' + (firstErr || 'unknown'))
      }, 15000)
      setTimeout(function () { if (!booted() && !window.__bapStarted) rescue('never started: ' + (firstErr || 'unknown')) }, 30000)
    })()
    </script>

    <!-- The loading screen: the BAP logo filling up (public/loading.json, a Lottie
         animation played by public/vendor/lottie_light.min.js). The fill is real
         progress, not a timer: the page, the app's code, the fonts, then the first
         screen drawn (src/main.jsx reports each). When it's all in, the rest plays
         (the players and the stripes) and it fades out. In the app it shows every
         launch; on the website only on phones, on the first load of a visit. -->
    <style>
      #bap-loader { position: fixed; inset: 0; z-index: 2147483000; background: radial-gradient(130% 75% at 50% 5%, #5da47f 0%, #3f7a5b 30%, #23432f 58%, #121a16 80%); transition: opacity .35s ease; }
      #bap-loader.is-out { opacity: 0; pointer-events: none; }
      #bap-loader .bl-anim { position: absolute; inset: 0; }
      #bap-loader .bl-anim svg { display: block; }
    </style>
    <div id="bap-loader" aria-hidden="true"><div class="bl-anim"></div></div>
    <script>
      (function () {
        var el = document.getElementById('bap-loader')
        var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
        var KEY = 'bap_loaded'
        var seen = false
        try { seen = !native && sessionStorage.getItem(KEY) === '1' } catch (e) {}
        // (desktop website: no loading screen, it's built for a phone screen)
        var desktop = !native && window.matchMedia && matchMedia('(min-width: 769px)').matches
        if (seen || desktop) { el.parentNode.removeChild(el); window.__bapLoad = window.__bapLoaded = function () {}; return }
        // the native splash is the animation's first frame (assets/splash.png): it goes
        // once that frame is drawn here, so the one becomes the other with no seam
        var splashGone = false
        function hideSplash() {
          if (!native || splashGone) return; splashGone = true
          requestAnimationFrame(function () { requestAnimationFrame(function () {
            try { window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 120 }) } catch (e) {}
          }) })
        }
        setTimeout(hideSplash, 2500)       // (the animation is slow to come: go anyway)
        var FILL = 89                   // frames 0-89: the logo fills (the progress); 89-150: the finish
        var target = 0.15, shown = 0, soft = 0, done = false, finishing = false, gone = false, anim = null
        var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        // a milestone reached (0-1), and everything in
        window.__bapLoad = function (p) { if (p > target) target = p }
        window.__bapLoaded = function () { done = true }
        function out() {
          if (gone) return; gone = true
          hideSplash()
          try { sessionStorage.setItem(KEY, '1') } catch (e) {}
          el.classList.add('is-out')
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); try { anim && anim.destroy() } catch (e) {} }, 400)
        }
        function tick() {
          if (gone) return
          // between milestones the bar keeps creeping (never past the next one), so it never looks stuck
          soft = Math.min(Math.min(0.95, target + 0.2), Math.max(soft, target) + 0.0025)
          var goal = done ? 1 : Math.max(target, soft)
          shown += (goal - shown) * (done ? 0.18 : 0.08)
          if (anim && !finishing) anim.goToAndStop(Math.min(FILL, shown * FILL), true)
          if (done && shown > 0.985 && !finishing) {
            finishing = true
            if (!anim || calm) { out(); return }
            anim.setSpeed(1.5)
            anim.addEventListener('complete', out)
            anim.playSegments([FILL, anim.totalFrames - 1], true)
            setTimeout(out, 1800)          // the finish never holds the app up
            return
          }
          requestAnimationFrame(tick)
        }
        function start() {
          try {
            anim = window.lottie.loadAnimation({ container: el.firstChild, renderer: 'svg', loop: false, autoplay: false, path: '/loading.json',
              rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } })
            anim.addEventListener('DOMLoaded', function () { anim.goToAndStop(Math.min(FILL, shown * FILL), true); hideSplash() })
          } catch (e) { anim = null; hideSplash() }
        }
        var s = document.createElement('script')
        s.src = '/vendor/lottie_light.min.js'
        s.onload = start
        s.onerror = hideSplash
        document.head.appendChild(s)
        requestAnimationFrame(tick)
        // never stuck: if the app hasn't finished in 20 s, it goes anyway
        setTimeout(out, 20000)
      })()
    </script>
